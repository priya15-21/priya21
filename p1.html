<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body>
        <h1><center>User Registration Form</center></h1>
        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br><br>

            <label for="confirm_password">Confirm Password:</label><br>
            <input type="password" id="confirm_password" name="confirm_password"><br><br>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your address"></textarea><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label>hobbies:</label><br>
            <input checked type="checkbox" id="reading" name="hobbies">
            <label for="reading">Reading</label><br>
            <input checked type="checkbox" id="writing" name="hobbies">
            <label for="writing">Writing</label><br>
            <input checked type="checkbox" id="traveling" name="hobbies">
            <label for="traveling">Traveling</label><br>
            <input checked type="checkbox" id="sports" name="hobbies">
            <label for="sports">Sports</label><br>

            <p>select your city:</p>
            <select name="city">
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="india">India</option>
                <option value="australia">Australia</option>
        </form>
    </body>
</html>
